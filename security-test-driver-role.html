<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLETYA · Prueba de rol de fletero</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;max-width:650px;margin:24px auto;padding:0 16px;background:#f4f7f8;color:#172126}main{background:#fff;padding:22px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 14px}button{padding:13px;background:#087f8c;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;background:#f4f7f8;padding:14px}</style></head><body><main><h1>FLETYA · Prueba de protección de roles</h1><p>Solo FLETYA-testing. No compartas contraseñas ni tokens. Esta prueba intenta cambiar el rol del fletero a admin y verifica el resultado.</p><label>Correo de fletero de prueba</label><input id="email" type="email" value="ernestoalejandrorivero87@gmail.com"><label>Contraseña de esa cuenta</label><input id="password" type="password"><button id="run">Probar bloqueo de cambio de rol</button><pre id="out">Página cargada. Pulsa el botón para empezar.</pre></main><script>const SUPABASE_URL='https://ccdtpwvalqznasstnqxj.supabase.co',SUPABASE_KEY='sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89',DRIVER='3a2da4c9-6faf-48bf-b0b8-13aa3074359a';const out=document.getElementById('out');document.getElementById('run').onclick=async()=>{let s;const b=document.getElementById('run');b.disabled=true;try{if(!window.supabase)throw Error('No cargó la biblioteca; recarga la página.');s=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const {data:a,error:ae}=await s.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(ae)throw Error('Inicio de sesión fallido: '+ae.message);if(a.user.id!==DRIVER)throw Error('La cuenta no coincide con el fletero de prueba autorizado; no se modificó nada.');const {data:p,error:pe}=await s.from('profiles').select('role').eq('id',DRIVER).single();if(pe)throw Error('No se pudo leer el perfil: '+pe.message);if(p.role!=='driver')throw Error('Rol inicial inesperado: '+p.role+'; no se intentó cambiar.');out.textContent='Intentando cambiar driver → admin…';const {error:u}=await s.from('profiles').update({role:'admin'}).eq('id',DRIVER).select('role');const {data:q,error:qe}=await s.from('profiles').select('role').eq('id',DRIVER).single();if(qe)throw Error('No se pudo verificar el rol: '+qe.message);if(q.role==='driver')out.textContent='BLOQUEO CONFIRMADO ✓\\nEl rol sigue siendo driver.\\n'+(u?'Respuesta del servidor: '+u.message:'El servidor no guardó el cambio.')+'\\nNo se modificó el rol.';else out.textContent='ALERTA: el rol quedó como '+q.role+'. No continúes usando esta cuenta; requiere restauración y revisión inmediata.';}catch(e){out.textContent='PRUEBA INTERRUMPIDA\\n'+(e.message||String(e));}finally{if(s)try{await s.auth.signOut()}catch(e){}b.disabled=false;}};</script></body></html>
