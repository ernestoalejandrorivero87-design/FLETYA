plugins { id 'com.android.application' }
def firebaseConfig = new groovy.json.JsonSlurper().parse(file('src/piloto/google-services.json'))
def firebaseClient = firebaseConfig.client.find { it.client_info.android_client_info.package_name == 'app.fletya.driver' }
if (!firebaseClient) throw new GradleException('Firebase package must match app.fletya.driver')
def testMapsKey = providers.environmentVariable('FLETYA_MAPS_ANDROID_TEST_KEY').getOrElse('').trim()
def pilotMapsKey = providers.environmentVariable('FLETYA_MAPS_ANDROID_PILOT_KEY').getOrElse('').trim()
def pilotSigning = [
    store: providers.environmentVariable('FLETYA_PILOT_KEYSTORE').orNull,
    storePassword: providers.environmentVariable('FLETYA_PILOT_STORE_PASSWORD').orNull,
    alias: providers.environmentVariable('FLETYA_PILOT_KEY_ALIAS').orNull,
    keyPassword: providers.environmentVariable('FLETYA_PILOT_KEY_PASSWORD').orNull
]
if (pilotSigning.values().any { it } && !pilotSigning.values().every { it }) {
    throw new GradleException('Incomplete FLETYA Pilot signing configuration')
}
if (pilotSigning.store && !file(pilotSigning.store).isFile()) {
    throw new GradleException('FLETYA Pilot keystore file is missing')
}
android {
    namespace 'app.fletya.driver'
    compileSdk 36
    defaultConfig {
        applicationId 'app.fletya.driver'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
    }
    buildFeatures { buildConfig true }
    sourceSets.main.java.srcDir '../../android-shared/src/main/java'
    signingConfigs {
        if (pilotSigning.store) {
            pilotDistribution {
                storeFile file(pilotSigning.store)
                storePassword pilotSigning.storePassword
                keyAlias pilotSigning.alias
                keyPassword pilotSigning.keyPassword
            }
        }
    }
    // A build type's signing config takes precedence over the product flavor.
    if (pilotSigning.store) {
        buildTypes.debug.signingConfig = null
    }
    flavorDimensions += 'environment'
    productFlavors {
        pruebas {
            if (pilotSigning.store) signingConfig signingConfigs.debug
            manifestPlaceholders = [fletyaMapsAndroidKey: testMapsKey ?: "disabled"]
            buildConfigField 'boolean', 'NATIVE_ROUTE_MAP', (!testMapsKey.isEmpty()).toString()
            versionCode 9
            versionName '0.6.3'
            buildConfigField 'boolean', 'TEST_ROUTE_PRICING', 'true'
            dimension 'environment'
            applicationIdSuffix '.pruebas'
            buildConfigField 'boolean', 'PUSH_ENABLED', 'false'
            resValue 'string', 'app_name', 'FLETYA Fletero · Pruebas'
            buildConfigField 'String', 'SUPABASE_URL', '"https://ccdtpwvalqznasstnqxj.supabase.co"'
            buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89"'
            buildConfigField 'String', 'ENVIRONMENT', '"PRUEBAS"'
        }
        piloto {
            if (pilotSigning.store) signingConfig signingConfigs.pilotDistribution
            manifestPlaceholders = [fletyaMapsAndroidKey: pilotMapsKey ?: "disabled"]
            buildConfigField 'boolean', 'NATIVE_ROUTE_MAP', (!pilotMapsKey.isEmpty()).toString()
            versionCode 8
            versionName '0.5.1'
            buildConfigField 'boolean', 'TEST_ROUTE_PRICING', 'false'
            dimension 'environment'
            buildConfigField 'boolean', 'PUSH_ENABLED', 'true'
            resValue 'string', 'google_app_id', firebaseClient.client_info.mobilesdk_app_id
            resValue 'string', 'gcm_defaultSenderId', firebaseConfig.project_info.project_number
            resValue 'string', 'google_api_key', firebaseClient.api_key[0].current_key
            resValue 'string', 'project_id', firebaseConfig.project_info.project_id
            resValue 'string', 'app_name', 'FLETYA Fletero · Piloto'
            buildConfigField 'String', 'SUPABASE_URL', '"https://wsdfqscrvfygxripmrzi.supabase.co"'
            buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_55QV-5z5xSpDHvWmtT-XAA_-1XVW-2O"'
            buildConfigField 'String', 'ENVIRONMENT', '"PILOTO · Servicios reales"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation "com.google.android.gms:play-services-maps:19.2.0"
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
