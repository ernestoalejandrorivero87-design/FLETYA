plugins { id 'com.android.application' }
def firebaseConfig = new groovy.json.JsonSlurper().parse(file('src/piloto/google-services.json'))
def firebaseClient = firebaseConfig.client.find { it.client_info.android_client_info.package_name == 'app.fletya.driver' }
if (!firebaseClient) throw new GradleException('Firebase package must match app.fletya.driver')
android {
    namespace 'app.fletya.driver'
    compileSdk 36
    defaultConfig {
        applicationId 'app.fletya.driver'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '0.4.0'
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'environment'
    productFlavors {
        pruebas {
            dimension 'environment'
            applicationIdSuffix '.pruebas'
            buildConfigField 'boolean', 'PUSH_ENABLED', 'false'
            resValue 'string', 'app_name', 'FLETYA Fletero · Pruebas'
            buildConfigField 'String', 'SUPABASE_URL', '"https://ccdtpwvalqznasstnqxj.supabase.co"'
            buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89"'
            buildConfigField 'String', 'ENVIRONMENT', '"PRUEBAS"'
        }
        piloto {
            dimension 'environment'
            buildConfigField 'boolean', 'PUSH_ENABLED', 'true'
            resValue 'string', 'google_app_id', firebaseClient.client_info.mobilesdk_app_id
            resValue 'string', 'gcm_defaultSenderId', firebaseConfig.project_info.project_number
            resValue 'string', 'google_api_key', firebaseClient.api_key[0].current_key
            resValue 'string', 'project_id', firebaseConfig.project_info.project_id
            resValue 'string', 'app_name', 'FLETYA Fletero · Piloto'
            buildConfigField 'String', 'SUPABASE_URL', '"https://wsdfqscrvfygxripmrzi.supabase.co"'
            buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_55QV-5z5xSpDHvWmtT-XAA_-1XVW-2O"'
            buildConfigField 'String', 'ENVIRONMENT', '"PILOTO · Servicios reales"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
