plugins { id 'com.android.application' }
def configFile=file('src/piloto/google-services.json')
def firebaseConfig=configFile.exists()?new groovy.json.JsonSlurper().parse(configFile):null
def firebaseClient=firebaseConfig?.client?.find { it.client_info.android_client_info.package_name == 'app.fletya.client' }
if(firebaseConfig && !firebaseClient)throw new GradleException('Firebase package must match app.fletya.client')
android {
    namespace 'app.fletya.client'
    compileSdk 36
    defaultConfig {
        applicationId 'app.fletya.client'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'environment'
    productFlavors {
        pruebas {
            dimension 'environment'
            applicationIdSuffix '.pruebas'
            buildConfigField 'boolean', 'PUSH_ENABLED', 'false'
            resValue 'string', 'app_name', 'FLETYA Cliente · Pruebas'
            buildConfigField 'String', 'SUPABASE_URL', '"https://ccdtpwvalqznasstnqxj.supabase.co"'
            buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89"'
            buildConfigField 'String', 'ENVIRONMENT', '"PRUEBAS"'
        }
        piloto {
            buildConfigField 'boolean', 'PUSH_ENABLED', firebaseClient?'true':'false'
            if(firebaseClient){
                resValue 'string','google_app_id',firebaseClient.client_info.mobilesdk_app_id
                resValue 'string','gcm_defaultSenderId',firebaseConfig.project_info.project_number
                resValue 'string','google_api_key',firebaseClient.api_key[0].current_key
                resValue 'string','project_id',firebaseConfig.project_info.project_id
            }
            dimension 'environment'
            resValue 'string', 'app_name', 'FLETYA Cliente · Piloto'
            buildConfigField 'String', 'SUPABASE_URL', '"https://wsdfqscrvfygxripmrzi.supabase.co"'
            buildConfigField 'String', 'SUPABASE_KEY', '"sb_publishable_55QV-5z5xSpDHvWmtT-XAA_-1XVW-2O"'
            buildConfigField 'String', 'ENVIRONMENT', '"PILOTO · Servicios reales"'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
