(function(){const TEST_SUPABASE_URL='https://ccdtpwvalqznasstnqxj.supabase.co';const TEST_SUPABASE_KEY='sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89';const TEST_JOB_ID='c201dee1-d9d5-4e62-8ad8-6dfb7adb31a6';const TEST_DRIVER_ID='ba51357e-6aff-4dfb-ba8b-9f85626c2b04';const out=document.getElementById('out');const btn=document.getElementById('run');btn.addEventListener('click',runTest);async function runTest(){btn.disabled=true;let sb;try{out.textContent='Conectando con FLETYA-testing…';if(!window.supabase||!window.supabase.createClient)throw Error('No cargó la biblioteca de conexión. Recarga la página.');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw Error('Escribe el correo y contraseña de prueba.');sb=window.supabase.createClient(TEST_SUPABASE_URL,TEST_SUPABASE_KEY);const {data:auth,error:authErr}=await sb.auth.signInWithPassword({email,password});if(authErr)throw Error('No se pudo iniciar sesión: '+authErr.message);if(!auth.user||auth.user.id!==TEST_DRIVER_ID)throw Error('Esta cuenta no es la propietaria del pedido seleccionado. No se modificó nada.');out.textContent='Verificando pedido…';const {data:job,error:readErr}=await sb.from('jobs').select('id,price,status,driver_id').eq('id',TEST_JOB_ID).single();if(readErr)throw Error('No se pudo leer el pedido: '+readErr.message);if(job.driver_id!==auth.user.id||job.status!=='en_route')throw Error('El pedido ya no está en ruta o no corresponde a esta cuenta. No se modificó nada.');const original=Number(job.price),attempted=Number((original+0.01).toFixed(2));out.textContent='Intentando cambio controlado y verificando precio…';const {data:changed,error:updateErr}=await sb.from('jobs').update({price:attempted}).eq('id',TEST_JOB_ID).select('id,price');const {data:after,error:afterErr}=await sb.from('jobs').select('price,status').eq('id',TEST_JOB_ID).single();if(afterErr)throw Error('No se pudo verificar el precio: '+afterErr.message);const current=Number(after.price);if(current===original){out.textContent='PRECIO SIN CAMBIOS ✓\nAntes: $'+original.toFixed(2)+' MXN\nDespués: $'+current.toFixed(2)+' MXN\n'+(updateErr?'Respuesta del servidor: '+updateErr.message:'No se guardó ningún cambio.')+'\nResultado compatible con bloqueo; no prueba por sí solo toda la seguridad.';}else if(current===attempted){out.textContent='ALERTA: el precio cambió. Intentando restaurarlo…';const {error:restoreErr}=await sb.from('jobs').update({price:original}).eq('id',TEST_JOB_ID);const {data:restored,error:verifyErr}=await sb.from('jobs').select('price').eq('id',TEST_JOB_ID).single();if(!restoreErr&&!verifyErr&&Number(restored.price)===original)out.textContent='FALLO DE SEGURIDAD: el precio pudo cambiar. Se restauró el precio original. No fusionar cambios hasta corregir.';else out.textContent='FALLO DE SEGURIDAD: el precio cambió y no se pudo confirmar su restauración. No continúes; requiere revisión.';}else out.textContent='RESULTADO NO CONCLUYENTE. Precio inicial: '+original+'; actual: '+current+'. Requiere revisión.';}catch(e){out.textContent='PRUEBA INTERRUMPIDA\n'+(e&&e.message?e.message:String(e));}finally{if(sb){try{await sb.auth.signOut()}catch(e){}}btn.disabled=false;}}})();
</script></body></html>
