<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLETYA · Prueba de pago</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;max-width:680px;margin:20px auto;padding:0 16px;background:#f4f7f8;color:#172126}main{background:white;border:1px solid #dce5e7;border-radius:16px;padding:20px}input{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd8db;border-radius:8px}button{padding:12px 16px;background:#087f8c;color:white;border:0;border-radius:9px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f8;padding:14px;border-radius:9px}</style></head><body><main><h1>FLETYA · Prueba de seguridad del pago</h1><p>Solo usa FLETYA-testing. No compartas contraseñas ni tokens. Esta prueba usa un servicio ya completado que pertenece a la cuenta fletero indicada.</p><label>Correo del fletero de prueba</label><input id="email" type="email" value="ernestoalejandrorivero87@gmail.com"><label>Contraseña de esa cuenta de prueba</label><input id="password" type="password"><button id="run" type="button">Probar bloqueo de pago</button><pre id="out">Página cargada. Pulsa el botón para empezar.</pre></main><script>(function(){const U='https://ccdtpwvalqznasstnqxj.supabase.co',K='sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89',J='b83a3df6-c344-446b-ab53-e8f69f601eee',D='3a2da4c9-6faf-48bf-b0b8-13aa3074359a';const out=document.getElementById('out'),btn=document.getElementById('run');btn.addEventListener('click',run);async function run(){btn.disabled=true;let sb;try{if(!window.supabase||!window.supabase.createClient)throw Error('No cargó la biblioteca de conexión. Recarga la página.');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw Error('Escribe correo y contraseña de la cuenta de prueba.');sb=window.supabase.createClient(U,K);out.textContent='Iniciando sesión en FLETYA-testing…';const {data:a,error:ae}=await sb.auth.signInWithPassword({email,password});if(ae)throw Error('No se pudo iniciar sesión: '+ae.message);if(!a.user||a.user.id!==D)throw Error('Esta cuenta no es el fletero propietario del servicio seleccionado. No se modificó nada.');out.textContent='Comprobando servicio completado y pago pendiente…';const {data:j,error:je}=await sb.from('jobs').select('id,status,driver_paid,driver_id').eq('id',J).single();if(je)throw Error('No se pudo leer el servicio: '+je.message);if(j.driver_id!==a.user.id||j.status!=='completed'||j.driver_paid!==false)throw Error('El servicio no está en el estado esperado o no corresponde a esta cuenta. No se modificó nada.');out.textContent='Intentando marcar el pago como realizado y comprobando el resultado…';const {error:ue}=await sb.from('jobs').update({driver_paid:true}).eq('id',J).select('id,driver_paid');const {data:after,error:ve}=await sb.from('jobs').select('status,driver_paid').eq('id',J).single();if(ve)throw Error('No se pudo verificar el estado del pago: '+ve.message);if(after.driver_paid===false){out.textContent='BLOQUEO CONFIRMADO ✓\nEl fletero no pudo marcarse el pago como realizado.\nEstado: '+after.status+'\ndriver_paid: false\n'+(ue?'Respuesta del servidor: '+ue.message:'El servidor no guardó el cambio.')+'\n\nLa fila permanece sin marcar como pagada.';}else if(after.driver_paid===true){out.textContent='ALERTA: el cambio fue aceptado. Intentando restaurar driver_paid=false…';const {error:re}=await sb.from('jobs').update({driver_paid:false}).eq('id',J);const {data:restored,error:rve}=await sb.from('jobs').select('driver_paid').eq('id',J).single();if(!re&&!rve&&restored.driver_paid===false)out.textContent='FALLO DE SEGURIDAD: el fletero pudo marcar el pago como realizado. El valor original false fue restaurado. No fusionar los cambios de seguridad.';else out.textContent='FALLO DE SEGURIDAD: el estado del pago cambió y no se pudo confirmar su restauración. Detén las pruebas y revisa FLETYA-testing.';}else out.textContent='Resultado no concluyente: el estado no coincide con true ni false.';}catch(e){out.textContent='PRUEBA INTERRUMPIDA\n'+(e&&e.message?e.message:String(e));}finally{if(sb){try{await sb.auth.signOut()}catch(e){}}btn.disabled=false;}}})();</script></body></html>
