<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLETYA · Prueba de permisos del cliente</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;max-width:680px;margin:20px auto;padding:0 16px;background:#f4f7f8;color:#172126}main{background:#fff;border:1px solid #dce5e7;border-radius:16px;padding:20px}input{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccd8db;border-radius:8px}button{padding:12px 16px;background:#087f8c;color:white;border:0;border-radius:9px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7f8;padding:14px;border-radius:9px}</style></head><body><main><h1>FLETYA · Prueba de permisos del cliente</h1><p>Solo FLETYA-testing. No compartas contraseñas ni tokens. Se usará un servicio de prueba ya completado, propiedad de la cuenta cliente indicada.</p><label>Correo del cliente de prueba</label><input id="email" type="email" value="ernestoalejandro1410@gmail.com"><label>Contraseña de esa cuenta de prueba</label><input id="password" type="password"><button id="run" type="button">Probar permisos del cliente</button><pre id="out">Página cargada. Pulsa el botón para empezar.</pre></main><script>(function(){const U='https://ccdtpwvalqznasstnqxj.supabase.co',K='sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89',J='b83a3df6-c344-446b-ab53-e8f69f601eee',C='a7793264-dadf-4b9e-ad4d-6da78c205e90';const out=document.getElementById('out'),btn=document.getElementById('run');btn.addEventListener('click',run);async function run(){btn.disabled=true;let sb;try{if(!window.supabase||!window.supabase.createClient)throw Error('No cargó la biblioteca de conexión. Recarga la página.');const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)throw Error('Escribe correo y contraseña de prueba.');sb=window.supabase.createClient(U,K);out.textContent='Iniciando sesión en FLETYA-testing…';const {data:a,error:ae}=await sb.auth.signInWithPassword({email,password});if(ae)throw Error('No se pudo iniciar sesión: '+ae.message);if(!a.user||a.user.id!==C)throw Error('Esta cuenta no es el cliente propietario del servicio seleccionado. No se intentó modificar nada.');out.textContent='Verificando que el servicio de prueba sea propio y esté completado…';const {data:j,error:je}=await sb.from('jobs').select('id,client_id,status,price,driver_id,driver_paid').eq('id',J).single();if(je)throw Error('No se pudo leer el servicio: '+je.message);if(j.client_id!==a.user.id||j.status!=='completed')throw Error('El servicio no pertenece a esta cuenta o no está completado. No se intentó modificar nada.');const original={price:Number(j.price),status:j.status,driver_id:j.driver_id,driver_paid:j.driver_paid};const tests=[{name:'cambiar el precio',patch:{price:Number((original.price+0.01).toFixed(2))},check:x=>Number(x.price)===original.price},{name:'cambiar el estado del servicio',patch:{status:'requested'},check:x=>x.status===original.status},{name:'cambiar el fletero asignado',patch:{driver_id:null},check:x=>x.driver_id===original.driver_id}];let lines=['Servicio de prueba: '+J,'Estado inicial: '+original.status,'Precio inicial: $'+original.price.toFixed(2)+' MXN',''];for(const t of tests){out.textContent='Probando si el cliente puede '+t.name+'…';const {error:ue}=await sb.from('jobs').update(t.patch).eq('id',J).select('id');const {data:after,error:ve}=await sb.from('jobs').select('status,price,driver_id,driver_paid').eq('id',J).single();if(ve)throw Error('No se pudo verificar la prueba de '+t.name+': '+ve.message);if(t.check(after)){lines.push('BLOQUEADO ✓: '+t.name+(ue?' ('+ue.message+')':''));}else{lines.push('ALERTA: el intento alteró datos al '+t.name+'.');out.textContent=lines.join('\n')+'\nIntentando restaurar los valores iniciales…';const {error:re}=await sb.from('jobs').update({price:original.price,status:original.status,driver_id:original.driver_id,driver_paid:original.driver_paid}).eq('id',J);const {data:restored,error:rve}=await sb.from('jobs').select('status,price,driver_id,driver_paid').eq('id',J).single();if(re||rve||Number(restored.price)!==original.price||restored.status!==original.status||restored.driver_id!==original.driver_id||restored.driver_paid!==original.driver_paid){lines.push('ATENCIÓN: no se pudo confirmar restauración completa. Detén las pruebas y revisa el entorno.');out.textContent=lines.join('\n');return;}lines.push('Los valores iniciales fueron restaurados.');out.textContent=lines.join('\n');return;}}out.textContent=lines.join('\n')+'\nRESULTADO: los tres intentos no cambiaron los valores del servicio. Esto comprueba estos intentos concretos, no todos los permisos de la plataforma.';}catch(e){out.textContent='PRUEBA INTERRUMPIDA\n'+(e&&e.message?e.message:String(e));}finally{if(sb){try{await sb.auth.signOut()}catch(e){}}btn.disabled=false;}}})();</script></body></html>
