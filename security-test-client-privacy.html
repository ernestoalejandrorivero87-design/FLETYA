<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLETYA · Privacidad entre clientes</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;max-width:650px;margin:24px auto;padding:0 16px;background:#f4f7f8;color:#172126}main{background:#fff;padding:22px;border-radius:16px}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 14px}button{padding:13px;background:#087f8c;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;background:#f4f7f8;padding:14px}</style></head><body><main><h1>FLETYA · Privacidad entre clientes</h1><p>Solo FLETYA-testing. Inicia sesión con el cliente de prueba e intenta consultar servicios que pertenecen a otros clientes. La página solo muestra cantidades, no datos de servicios.</p><label>Correo de cliente de prueba</label><input id="email" type="email" value="ernestoalejandro1410@gmail.com"><label>Contraseña de esa cuenta</label><input id="password" type="password"><button id="run">Comprobar privacidad</button><pre id="out">Página cargada. Pulsa el botón para empezar.</pre></main><script>const SUPABASE_URL='https://ccdtpwvalqznasstnqxj.supabase.co',SUPABASE_KEY='sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89',CLIENT='a7793264-dadf-4b9e-ad4d-6da78c205e90';const out=document.getElementById('out');document.getElementById('run').onclick=async()=>{let s;const b=document.getElementById('run');b.disabled=true;try{if(!window.supabase)throw Error('No cargó la biblioteca; recarga la página.');s=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});const {data:a,error:ae}=await s.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(ae)throw Error('Inicio de sesión fallido: '+ae.message);if(a.user.id!==CLIENT)throw Error('La cuenta no coincide con el cliente autorizado.');const {data:own,error:oe}=await s.from('jobs').select('id',{count:'exact'}).eq('client_id',CLIENT);if(oe)throw Error('No se pudo consultar el servicio propio: '+oe.message);const {data:other,error:xe}=await s.from('jobs').select('id',{count:'exact'}).neq('client_id',CLIENT);if(xe)throw Error('La consulta a otros clientes devolvió error: '+xe.message);const n=(other||[]).length;if(n===0)out.textContent='PRIVACIDAD CONFIRMADA ✓\nLa consulta de servicios de otros clientes devolvió 0 filas.\nServicios propios visibles: '+(own||[]).length+' (solo cantidad).\nNo se mostraron datos personales.';else out.textContent='REVISIÓN NECESARIA ⚠\nLa consulta devolvió '+n+' fila(s) de otros clientes.\nNo se mostrarán IDs ni datos. Detén las pruebas y revisemos las políticas RLS de FLETYA-testing.';}catch(e){out.textContent='PRUEBA INTERRUMPIDA\n'+(e.message||String(e));}finally{if(s)try{await s.auth.signOut()}catch(e){}b.disabled=false;}};</script></body></html>
