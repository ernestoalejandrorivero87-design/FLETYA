name: Android cliente
on:
  pull_request:
    paths: ['apps/cliente-android/**', '.github/workflows/android-cliente.yml']
  push:
    branches: [main]
    paths: ['apps/cliente-android/**', '.github/workflows/android-cliente.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build both environments
        working-directory: apps/cliente-android
        run: gradle --no-daemon testPruebasDebugUnitTest lintPruebasDebug assemblePruebasDebug assemblePilotoDebug assemblePilotoRelease
      - name: Sign and verify Piloto release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/pilot-integration-0617-review'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FLETYA_PILOT_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.FLETYA_PILOT_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.FLETYA_PILOT_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLETYA_PILOT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          ks=$(mktemp)
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signed-piloto
          for apk in apps/cliente-android/app/build/outputs/apk/piloto/release/*-unsigned.apk; do
            "$sdk/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$sdk/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "signed-piloto/FLETYA-Cliente-Piloto.apk" "$RUNNER_TEMP/aligned.apk"
            "$sdk/apksigner" verify --print-certs "signed-piloto/FLETYA-Cliente-Piloto.apk" | tee "$RUNNER_TEMP/cert.txt"
            grep -Fi '42c513aceaca6fe4d58a2529b1a7c6143145ecffd4becfeac0e63f9ff60c1813' "$RUNNER_TEMP/cert.txt"
          done
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/pilot-integration-0617-review'
        with:
          name: FLETYA-Cliente-Piloto-signed-${{ github.sha }}
          path: signed-piloto/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: FLETYA-Cliente-Android-${{ github.sha }}
          path: |
            apps/cliente-android/app/build/outputs/apk/pruebas/debug/*.apk
            apps/cliente-android/app/build/outputs/apk/piloto/debug/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: FLETYA-Cliente-Piloto-unsigned-${{ github.sha }}
          path: apps/cliente-android/app/build/outputs/apk/piloto/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-cliente-validation-${{ github.sha }}
          path: |
            apps/cliente-android/app/build/reports/
            apps/cliente-android/app/build/test-results/
          retention-days: 14
