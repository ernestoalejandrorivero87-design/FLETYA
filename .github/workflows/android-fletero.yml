name: Android fletero
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/codex/pruebas-consolidacion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build PRUEBAS only
        working-directory: apps/fletero-android
        run: gradle --no-daemon testPruebasDebugUnitTest lintPruebasDebug assemblePruebasDebug
      - name: Sign and verify Pruebas with FLETYA distribution certificate
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/pruebas-consolidacion'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FLETYA_PILOT_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.FLETYA_PILOT_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.FLETYA_PILOT_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLETYA_PILOT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          ks=$(mktemp)
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          sdk="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signed-pruebas
          apk=apps/fletero-android/app/build/outputs/apk/pruebas/debug/app-pruebas-debug.apk
          "$sdk/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned-pruebas.apk"
          "$sdk/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "signed-pruebas/FLETYA-Fletero-Pruebas.apk" "$RUNNER_TEMP/aligned-pruebas.apk"
          "$sdk/apksigner" verify --print-certs "signed-pruebas/FLETYA-Fletero-Pruebas.apk" | tee "$RUNNER_TEMP/pruebas-cert.txt"
          grep -Fi '42c513aceaca6fe4d58a2529b1a7c6143145ecffd4becfeac0e63f9ff60c1813' "$RUNNER_TEMP/pruebas-cert.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/pruebas-consolidacion'
        with:
          name: FLETYA-Fletero-Pruebas-signed-${{ github.sha }}
          path: signed-pruebas/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation-${{ github.sha }}
          path: |
            apps/fletero-android/app/build/reports/
            apps/fletero-android/app/build/test-results/
          retention-days: 14
