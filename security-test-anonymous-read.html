<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLETYA · Prueba de lectura pública</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;max-width:650px;margin:24px auto;padding:0 16px;background:#f4f7f8;color:#172126}main{background:#fff;padding:22px;border-radius:16px}button{padding:13px;background:#087f8c;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;background:#f4f7f8;padding:14px}</style></head><body><main><h1>FLETYA · Prueba de lectura sin sesión</h1><p>Solo FLETYA-testing. Comprueba si alguien sin iniciar sesión puede leer IDs de perfiles o servicios. La página solo muestra cantidades y errores; no muestra datos personales.</p><button id="run">Comprobar acceso público</button><pre id="out">Página cargada. Pulsa el botón para empezar.</pre></main><script>const SUPABASE_URL='https://ccdtpwvalqznasstnqxj.supabase.co',SUPABASE_KEY='sb_publishable_l9eqPSc8ifaIacmQJFOudw_rWpTSg89';const out=document.getElementById('out');document.getElementById('run').onclick=async()=>{const b=document.getElementById('run');b.disabled=true;try{if(!window.supabase)throw Error('No cargó la biblioteca; recarga la página.');const s=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false}});const [p,j]=await Promise.all([s.from('profiles').select('id',{count:'exact'}).limit(5),s.from('jobs').select('id',{count:'exact'}).limit(5)]);const lines=[];for(const [name,r] of [['profiles',p],['jobs',j]]){if(r.error)lines.push(name+': LECTURA BLOQUEADA / ERROR — '+r.error.message);else if((r.data||[]).length===0)lines.push(name+': no se devolvieron filas; lectura no expuso registros.');else lines.push(name+': AVISO — la petición anónima devolvió '+r.data.length+' ID(s); revisar política RLS.');}out.textContent=lines.join('\\n')+'\\n\\nEsta prueba solo comprueba lectura anónima de IDs; no certifica toda la política RLS.';}catch(e){out.textContent='PRUEBA INTERRUMPIDA\\n'+(e.message||String(e));}finally{b.disabled=false;}};</script></main></body></html>
